name: Deploy Space

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push replaces a queued one so the Space ends on the latest commit.
concurrency:
  group: deploy-space
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        id: config
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "::notice title=Space deploy skipped::Set the secret HF_TOKEN and the variable HF_SPACE to deploy (see space/README.md, 'Deploying from GitHub')."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.config.outputs.enabled == 'true'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.config.outputs.enabled == 'true'
        with:
          python-version: "3.12"
      - name: Assemble bundle
        if: steps.config.outputs.enabled == 'true'
        run: ./space/bundle.sh "$RUNNER_TEMP/space-bundle"
      - name: Upload to the Space
        if: steps.config.outputs.enabled == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          python -m pip install "huggingface_hub==2.4.0"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          info = api.upload_folder(
              repo_id=os.environ["HF_SPACE"],
              repo_type="space",
              folder_path=os.path.join(os.environ["RUNNER_TEMP"], "space-bundle"),
              # Remove files of modules deleted from src/stage, but leave the Space's own
              # .gitattributes and anything else outside the bundle alone.
              delete_patterns=["stage/**", "app.py", "requirements.txt", "README.md"],
              commit_message=f"Deploy {os.environ['GITHUB_SHA'][:7]} from GitHub",
          )
          print(f"uploaded: {info}")
          PY
      # The deploy is only done when the Space has rebuilt and answers like the backend the web
      # app expects: running, with a /process endpoint that lists the default v2 profile.
      - name: Wait for the Space and check its API
        if: steps.config.outputs.enabled == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          repo = os.environ["HF_SPACE"]
          deadline = time.time() + 20 * 60
          stage = None
          while time.time() < deadline:
              stage = api.get_space_runtime(repo).stage
              print("space stage:", stage, flush=True)
              if stage == "RUNNING":
                  break
              if stage in ("BUILD_ERROR", "RUNTIME_ERROR", "CONFIG_ERROR"):
                  raise SystemExit(f"the Space failed to start: {stage}")
              time.sleep(20)
          else:
              raise SystemExit(f"the Space did not reach RUNNING in 20 minutes (last: {stage})")
          host = getattr(api.space_info(repo), "host", None) or (
              "https://" + repo.replace("/", "-").replace("_", "-").replace(".", "-").lower()
              + ".hf.space")
          for attempt in range(10):
              try:
                  req = urllib.request.Request(f"{host}/gradio_api/info",
                                               headers={"Authorization": f"Bearer {os.environ['HF_TOKEN']}"})
                  info = json.load(urllib.request.urlopen(req, timeout=60))
                  break
              except Exception as exc:
                  print("info not ready:", exc, flush=True)
                  time.sleep(15)
          else:
              raise SystemExit("the Space is running but /gradio_api/info does not answer")
          params = info["named_endpoints"]["/process"]["parameters"]
          profiles = next(p for p in params if p["parameter_name"] == "profile")["type"]["enum"]
          print("profiles:", profiles)
          assert "space:studio" in profiles, profiles
          print(f"{host} is live with the v2 engine")
          PY
