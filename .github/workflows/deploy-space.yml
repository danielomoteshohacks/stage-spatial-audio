name: Deploy Space

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push replaces a queued one so the Space ends on the latest commit.
concurrency:
  group: deploy-space
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        id: config
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "::notice title=Space deploy skipped::Set the secret HF_TOKEN and the variable HF_SPACE to deploy (see space/README.md, 'Deploying from GitHub')."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.config.outputs.enabled == 'true'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.config.outputs.enabled == 'true'
        with:
          python-version: "3.12"
      - name: Assemble bundle
        if: steps.config.outputs.enabled == 'true'
        run: ./space/bundle.sh "$RUNNER_TEMP/space-bundle"
      - name: Upload to the Space
        if: steps.config.outputs.enabled == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          python -m pip install "huggingface_hub==2.4.0"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          info = api.upload_folder(
              repo_id=os.environ["HF_SPACE"],
              repo_type="space",
              folder_path=os.path.join(os.environ["RUNNER_TEMP"], "space-bundle"),
              # Remove files of modules deleted from src/stage, but leave the Space's own
              # .gitattributes and anything else outside the bundle alone.
              delete_patterns=["stage/**", "app.py", "requirements.txt", "README.md"],
              commit_message=f"Deploy {os.environ['GITHUB_SHA'][:7]} from GitHub",
          )
          print(f"uploaded: {info}")
          PY
