name: HRTF pack

# Builds the measured-HRTF pack from SADIE II (University of York, Apache-2.0) on a GitHub runner,
# which has internet access, and publishes it as a release asset. The Space and the benchmark
# download it from there; nothing large is committed. Runs when the builder changes, or by hand.
on:
  push:
    branches: [main]
    paths:
      - tools/hrtf-pack/VERSION
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hrtf-pack
  cancel-in-progress: false


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A published pack is immutable: the Space checks its SHA-256, so a rebuild goes out under
      # a new tag (bump tools/hrtf-pack/VERSION and the checksum in stage.spatial.hrtf together).
      - name: Choose the release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="hrtf-pack-v$(cat tools/hrtf-pack/VERSION)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::$tag is already published; it is not rebuilt."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.tag.outputs.exists == 'false'
        with:
          python-version: "3.12"
      # h5py (BSD-3-Clause) reads SOFA, which is netCDF-4 on HDF5; no SOFA-specific library.
      - name: Install
        if: steps.tag.outputs.exists == 'false'
        run: python -m pip install -e . "h5py>=3.10"
      - name: Cache the SADIE II download
        if: steps.tag.outputs.exists == 'false'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/sadie2
          key: sadie2-zenodo-12092466
      - name: Build the pack
        if: steps.tag.outputs.exists == 'false'
        run: |
          mkdir -p ~/.cache/sadie2
          python tools/hrtf-pack/build_pack.py --out dist/hrtf --cache ~/.cache/sadie2
          ls -la dist/hrtf
      - name: Publish the release asset
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Measured HRTF pack for SoundStage, built by tools/hrtf-pack from commit ${GITHUB_SHA::7}."
            echo
            echo "Source: SADIE II Database, subject D1 (Neumann KU100), The Audio Lab, University of York."
            echo "Licence: Apache License 2.0. Attribution and checksums are in manifest.json."
          } > notes.md
          gh release create "${{ steps.tag.outputs.tag }}" dist/hrtf/* \
            --title "HRTF pack (SADIE II KU100)" --notes-file notes.md --latest=false
