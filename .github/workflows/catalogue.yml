name: Catalogue renders

# Renders the curated catalogue tracks (the first five of every shelf in
# configs/catalogue/seed.json) and publishes them to the Hugging Face dataset
# danieltesh/soundstage-catalogue, so they play spatially at once with no GPU. Weekly, and by hand.
# Needs the repository secret HF_TOKEN (a write token); without it the renders are kept as a
# workflow artifact and nothing is uploaded. CPU only: the `cpu` preset (htdemucs on the CPU plus
# the model-free levels); the GPU `best` preset is run on the Space (see decision 0028).
on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      preset:
        description: Preset
        default: cpu

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[separation]" huggingface_hub
      - name: Render this part
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          args="--out dist/catalogue --preset ${{ inputs.preset || 'cpu' }} --part ${{ matrix.part }} --of 4"
          if [ -n "$HF_TOKEN" ]; then args="$args --upload"; fi
          python scripts/render_catalogue.py $args
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalogue-part-${{ matrix.part }}
          path: dist/catalogue
          if-no-files-found: ignore

  index:
    needs: render
    if: ${{ always() && needs.render.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: dist/catalogue
          pattern: catalogue-part-*
          merge-multiple: true
      - name: Merge and publish the index
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m pip install huggingface_hub
          args="dist/catalogue"
          if [ -n "$HF_TOKEN" ]; then args="$args --upload"; fi
          python scripts/merge_catalogue_index.py $args
