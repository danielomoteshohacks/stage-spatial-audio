name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      # No torch or demucs here: the separation tests check the clear error and the Lite
      # fallback, and the real Demucs test skips itself.
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]" "gradio==6.32.0"
      - name: Service and app tests
        run: pytest -q tests/unit/test_service.py tests/backend
      - name: Space bundle imports on its own
        run: |
          ./space/bundle.sh "$RUNNER_TEMP/space-bundle"
          cd "$RUNNER_TEMP/space-bundle"
          python -c "import app, stage; from stage.config import config_dir, threshold_values; assert stage.__file__.startswith('$RUNNER_TEMP'), stage.__file__; assert str(config_dir()).startswith('$RUNNER_TEMP'), config_dir(); threshold_values(); print('bundle ok')"

  # The separator's training and export tests need torch; the CPU wheel keeps the job light.
  separator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]" onnx onnxscript onnxruntime BS-RoFormer pyyaml
      - name: Separator and cascade loader tests (overfit gate, ONNX parity, resume, tiny MSST checkpoint)
        run: pytest -q tests/separation tests/unit/test_cascade_neural.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Size budget (first load at most 250 KB gzipped, fonts included)
        run: npm run size
      - name: Lighthouse, mobile (performance and accessibility at least 90)
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run lighthouse
