name: HRTF heads

# Builds one measured-HRTF pack per SADIE II subject (University of York, Apache-2.0): the two
# dummy heads (D1 Neumann KU100, D2 KEMAR) and a set of human subjects, so the listener can pick
# the head that fits their ears (decision 0026). One job per subject on a GitHub runner, then one
# job publishes them all as a release. The Space downloads a head on demand and checks its SHA-256;
# nothing large is committed.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/hrtf-pack/HEADS_VERSION

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        subject: [D1, D2, H3, H4, H5, H6, H7, H8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e . "h5py>=3.10"
      - name: Build the pack
        run: python tools/hrtf-pack/build_pack.py --subject ${{ matrix.subject }} --out dist/hrtf
      - uses: actions/upload-artifact@v4
        with:
          name: pack-${{ matrix.subject }}
          path: dist/hrtf
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ always() && needs.build.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: pack-*
          merge-multiple: true
      - name: Index the heads
        run: |
          python - <<'PY'
          import glob, json
          heads = {}
          for p in sorted(glob.glob("dist/manifest*.json")):
              m = json.load(open(p))["pack"]
              heads[m["subject"]] = {"file": m["file"], "sha256": m["sha256"], "bytes": m["bytes"],
                                     "listener": m.get("listener", ""),
                                     "sample_rate": m["sample_rate"]}
          json.dump({"heads": heads, "licence": "Apache-2.0",
                     "attribution": "SADIE II Database, The Audio Lab, University of York (Armstrong, Thresh, Murphy and Kearney 2018)."},
                    open("dist/heads.json", "w"), indent=2)
          print(json.dumps(heads, indent=2))
          PY
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="hrtf-heads-v$(cat tools/hrtf-pack/HEADS_VERSION)"
          gh release view "$tag" >/dev/null 2>&1 && { echo "$tag exists"; exit 0; }
          gh release create "$tag" dist/*.npz dist/heads.json dist/manifest*.json \
            --title "HRTF heads (SADIE II)" --notes "One measured HRTF pack per SADIE II subject, built by tools/hrtf-pack. Apache-2.0." --latest=false
