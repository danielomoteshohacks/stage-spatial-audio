<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf8f5" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="SoundStage turns any song into a spatial scene around you on headphones, on any phone, and keeps the vocal and the bass where the artist put them." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Cover art is served by the catalogue's own hosts; open the connection early. -->
    <link rel="preconnect" href="https://api.openverse.org" crossorigin />
    <title>SoundStage</title>
    <script>
      // Set the theme before the first paint, so a dark-mode listener never sees a flash of light.
      try {
        var q = location.search.match(/theme=(dark|light)/), c = localStorage.getItem("soundstage.theme");
        document.documentElement.dataset.theme = q ? q[1] : c === "dark" || c === "light" ? c
          : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>SoundStage needs JavaScript to decode and play audio in your browser.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
