[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stage-spatial-audio"
version = "0.0.1"
description = "SoundStage: a spatial audio engine that lives inside the music app (any song, any phone, artist in control)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["numpy", "scipy", "soundfile"]

[project.optional-dependencies]
# pyloudnorm is only a cross-check of the BS.1770 meter in stage.guard.loudness (MIT licence).
dev = ["pytest", "ruff", "jsonschema", "pyloudnorm"]
viz = ["matplotlib"]
# Stem separation (Demucs). Heavy: torch alone is several hundred MB, so it stays optional and
# the Lite path never imports it.
separation = ["torch", "demucs"]
# The Gradio backend in space/ (the Space installs its own pinned list from space/requirements.txt).
backend = ["gradio"]

[project.urls]
Homepage = "https://github.com/danielomoteshohacks/stage-spatial-audio"
Issues = "https://github.com/danielomoteshohacks/stage-spatial-audio/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
