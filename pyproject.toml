[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stage-spatial-audio"
version = "0.0.1"
description = "Stage: a spatial audio engine that lives inside the music app (any song, any phone, artist in control)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["numpy", "scipy", "soundfile"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "jsonschema"]
viz = ["matplotlib"]

[project.urls]
Homepage = "https://github.com/danielomoteshohacks/stage-spatial-audio"
Issues = "https://github.com/danielomoteshohacks/stage-spatial-audio/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
